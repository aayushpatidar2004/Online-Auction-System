services:
  - type: web
    name: online-auction-system-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn auction_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-app.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-vercel-app.vercel.app"

# Optional: create a managed Postgres database for Render
# This will be automatically injected as DATABASE_URL by Render if enabled in the dashboard.
databases:
  - name: auction-db
    databaseName: auction_db
    user: auction_user
    plan: free
