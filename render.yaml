services:
  - type: web
    name: online-auction-system-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      pip install psycopg2-binary
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn auction_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,0.0.0.0,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://online-auction-system.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://online-auction-system.vercel.app,http://localhost:3000,http://127.0.0.1:3000"

# Optional: create a managed Postgres database for Render
# This will be automatically injected as DATABASE_URL by Render if enabled in the dashboard.
databases:
  - name: auction-db
    databaseName: auction_db
    user: auction_user
    plan: free
